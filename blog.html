<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog de Astrología y Autoconocimiento — aquamoon</title>
<meta name="description" content="Artículos sobre astrología, carta natal, planetas, casas, nodos kármicos y autoconocimiento, escritos desde la psicoastrología kármica y la terapia transpersonal.">
<link rel="canonical" href="https://www.aquamoon-astrologia.com/blog.html">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>
<div id="site-header" class="site-header"></div>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Inicio</a> / Blog</p>
      <div class="reveal is-visible" style="max-width:700px;">
        <p class="eyebrow">Blog</p>
        <h1>Ideas para pensar tu carta</h1>
        <p class="lede">Artículos para acercarte a la astrología sin tecnicismos innecesarios: planetas, casas, nodos y autoconocimiento, explicados con calma.</p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:1rem;">
    <div class="container">
      <div class="flex gap-1" id="blogFilters" style="flex-wrap:wrap; margin-bottom:2.5rem;"></div>
      <div class="grid grid-3" id="blogGrid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const cats = [...new Set(POSTS.map(p => p.categoria))];
  const filterMount = document.getElementById("blogFilters");
  filterMount.innerHTML = `<button class="btn btn-sm btn-outline filter-btn active" data-cat="todas">Todas</button>` +
    cats.map(c => `<button class="btn btn-sm btn-outline filter-btn" data-cat="${c}">${c}</button>`).join("");

  function render(cat){
    const mount = document.getElementById("blogGrid");
    const list = cat==="todas" ? POSTS : POSTS.filter(p => p.categoria===cat);
    mount.innerHTML = list.map(p => `
      <a href="blog-post.html?slug=${p.slug}" class="post-card reveal is-visible">
        <div style="aspect-ratio:4/3; border-radius:var(--radius-m); background:linear-gradient(160deg,var(--c-bg-soft),var(--c-bg-mist));"></div>
        <span class="cat">${p.categoria}</span>
        <h3>${p.titulo}</h3>
        <p>${p.resumen}</p>
      </a>
    `).join("");
  }
  filterMount.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      filterMount.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      render(btn.dataset.cat);
    });
  });
  render("todas");
});
</script>
</body>
</html>
